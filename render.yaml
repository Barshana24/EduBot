services:
  - type: web
    name: edubot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIM
        value: "3072"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edubot-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-at-least-32-chars}
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      - UPLOAD_DIR=/app/data/uploads
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000
      - RATE_LIMIT_PER_MINUTE=60
    volumes:
      - edubot-data:/app/data
    ports:
      - "8000:8000"
    networks:
      - edubot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edubot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - edubot-net

volumes:
  edubot-data:

networks:
  edubot-net:
    driver: bridge
